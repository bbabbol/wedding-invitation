<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포토부스 📸</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#1a1a2e;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden;
  }

  #capture-screen, #result-screen {
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    width:100%; height:100%;
  }
  #result-screen { display:none; }

  .stage {
    position:relative;
    width:100%;
    max-height:calc(100vh - 90px);
    aspect-ratio:16/9;
    max-width:calc((100vh - 90px) * 16/9);
  }

  #live-canvas, #result-canvas {
    display:block;
    width:100%; height:100%;
    border-radius:8px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }

  /* Countdown overlay */
  #countdown {
    position:absolute;
    inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:min(22vw, 200px);
    font-weight:900;
    color:#fff;
    text-shadow: 0 0 40px rgba(255,200,0,0.9), 0 4px 20px rgba(0,0,0,0.8);
    pointer-events:none;
    opacity:0;
    transition:none;
    z-index:10;
  }
  #countdown.show {
    animation: popIn 0.8s ease-out forwards;
  }
  @keyframes popIn {
    0%   { opacity:0; transform:scale(2.2); }
    25%  { opacity:1; transform:scale(1); }
    75%  { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(0.6); }
  }

  /* Flash overlay */
  #flash {
    position:fixed; inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
    z-index:999;
    transition:opacity 0.05s ease;
  }
  #flash.go { opacity:1; }

  /* Buttons */
  .btn-row {
    display:flex; gap:16px; padding:14px 0;
    align-items:center; justify-content:center;
    flex-shrink:0;
  }

  /* Shutter */
  #shutter-btn {
    width:68px; height:68px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff 0%, #d0d0d0 100%);
    border:5px solid rgba(255,255,255,0.4);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.6);
    cursor:pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    position:relative;
    outline:none;
  }
  #shutter-btn::after {
    content:'';
    position:absolute; inset:6px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.5) 0%, transparent 60%);
  }
  #shutter-btn:hover { transform:scale(1.08); box-shadow:0 6px 28px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.6); }
  #shutter-btn:active { transform:scale(0.94); }
  #shutter-btn:disabled { opacity:0.4; cursor:default; transform:none; }

  #save-btn, #retake-btn {
    padding:13px 38px;
    font-size:1rem; font-weight:700;
    border:none; border-radius:50px;
    cursor:pointer;
    letter-spacing:1px;
    transition: transform 0.15s, box-shadow 0.15s;
    outline:none;
  }
  #save-btn {
    background:linear-gradient(135deg, #ff6b6b, #ee5a24);
    color:#fff;
    box-shadow:0 4px 18px rgba(238,90,36,0.45);
  }
  #retake-btn {
    background:#fff;
    color:#333;
    box-shadow:0 4px 18px rgba(0,0,0,0.2);
  }
  #save-btn:hover, #retake-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
  #save-btn:active, #retake-btn:active { transform:translateY(0); }
</style>
</head>
<body>
<div id="flash"></div>

<!-- CAPTURE SCREEN -->
<div id="capture-screen">
  <div class="stage">
    <canvas id="live-canvas" width="1920" height="1080"></canvas>
    <div id="countdown"></div>
  </div>
  <div class="btn-row">
    <button id="shutter-btn" title="촬영"></button>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="result-screen">
  <div class="stage">
    <canvas id="result-canvas" width="1920" height="1080"></canvas>
  </div>
  <div class="btn-row">
    <button id="retake-btn">🔄 RETAKE</button>
    <button id="save-btn">💾 SAVE</button>
  </div>
</div>

  const frameImg = new Image();
  frameImg.onload = () => {
    frameOffscreen = chromaKey(frameImg);
    startCamera();
  };
  frameImg.src = "data:image/png;base64," + frameB64;

  function chromaKey(img) {
    const oc  = document.createElement('canvas');
    oc.width  = W; oc.height = H;
    const oct = oc.getContext('2d');
    oct.drawImage(img, 0, 0, W, H);

    const id   = oct.getImageData(0, 0, W, H);
    const data = id.data;

    for (let i = 0; i < data.length; i += 4) {
      const r = data[i], g = data[i+1], b = data[i+2];
      // Pure #00FF00 green with tolerance 60
      if (g > 180 && r < 100 && b < 100) {
        // Soft edge: partial transparency near boundary
        const greenness = (g - 180) / 75;         // 0→1
        const redness   = 1 - Math.min(r / 100, 1);
        const blueness  = 1 - Math.min(b / 100, 1);
        const alpha     = 1 - (greenness * redness * blueness);
        data[i+3] = Math.round(alpha * 255);
      }
    }
    oct.putImageData(id, 0, 0);
    return oc;
  }

  // ── Camera ────────────────────────────────────────────────
  let stream = null;
  let video  = null;
  let rafId  = null;

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: 'user' },
        audio: false
      });
      video = document.createElement('video');
      video.srcObject = stream;
      video.autoplay  = true;
      video.playsInline = true;
      video.muted     = true;
      video.onloadedmetadata = () => {
        video.play();
        loopLive();
      };
    } catch(e) {
      // Camera permission denied – show a message on canvas
      liveCtx.fillStyle = '#1a1a2e';
      liveCtx.fillRect(0, 0, W, H);
      if (frameOffscreen) liveCtx.drawImage(frameOffscreen, 0, 0, W, H);
      liveCtx.fillStyle = 'rgba(255,255,255,0.8)';
      liveCtx.font = 'bold 48px sans-serif';
      liveCtx.textAlign = 'center';
      liveCtx.fillText('카메라 접근을 허용해 주세요', W/2, H/2);
      console.error(e);
    }
  }

  function loopLive() {
    if (!video) return;
    // Background
    liveCtx.fillStyle = '#000';
    liveCtx.fillRect(0, 0, W, H);
    // Draw mirrored video
    liveCtx.save();
    liveCtx.translate(W, 0);
    liveCtx.scale(-1, 1);
    liveCtx.drawImage(video, 0, 0, W, H);
    liveCtx.restore();
    // Frame overlay
    if (frameOffscreen) liveCtx.drawImage(frameOffscreen, 0, 0, W, H);
    rafId = requestAnimationFrame(loopLive);
  }

  // ── Countdown + Capture ───────────────────────────────────
  shutterBtn.addEventListener('click', () => {
    if (shutterBtn.disabled) return;
    shutterBtn.disabled = true;
    runCountdown(3);
  });

  function runCountdown(n) {
    if (n === 0) {
      doCapture();
      return;
    }
    countdownEl.textContent = n;
    countdownEl.classList.remove('show');
    // Force reflow so animation re-triggers
    void countdownEl.offsetWidth;
    countdownEl.classList.add('show');
    setTimeout(() => runCountdown(n - 1), 900);
  }

  function doCapture() {
    // Flash
    flashEl.classList.add('go');
    setTimeout(() => flashEl.classList.remove('go'), 180);

    // Stop live loop
    cancelAnimationFrame(rafId); rafId = null;

    // Composite to result canvas
    resultCtx.fillStyle = '#000';
    resultCtx.fillRect(0, 0, W, H);
    resultCtx.save();
    resultCtx.translate(W, 0);
    resultCtx.scale(-1, 1);
    resultCtx.drawImage(video, 0, 0, W, H);
    resultCtx.restore();
    if (frameOffscreen) resultCtx.drawImage(frameOffscreen, 0, 0, W, H);

    // Switch screens
    captureScreen.style.display = 'none';
    resultScreen.style.display  = 'flex';
  }

  // ── Save ──────────────────────────────────────────────────
  saveBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'photobooth_' + Date.now() + '.png';
    link.href = resultCanvas.toDataURL('image/png');
    link.click();
  });

  // ── Retake ────────────────────────────────────────────────
  retakeBtn.addEventListener('click', () => {
    resultScreen.style.display  = 'none';
    captureScreen.style.display = 'flex';
    shutterBtn.disabled = false;
    countdownEl.textContent = '';
    countdownEl.classList.remove('show');
    loopLive();
  });
</script>
